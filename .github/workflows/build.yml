name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
    defaults:
      run:
        # Not just `bash` — this self-hosted Windows runner has the Microsoft Store WSL bash
        # stub ahead of Git Bash on PATH at least some of the time (observed: a tag-push run on
        # 2026-10-31 resolved to the WSL stub and failed with HCS_E_SERVICE_NOT_AVAILABLE, while
        # a workflow_dispatch run on 2026-10-28 on the same runner resolved to Git Bash and
        # succeeded — nothing in this repo changed PATH between the two). Pin the real Git Bash
        # path so this doesn't depend on PATH ordering on the host. 8.3 short path, no spaces:
        # the runner's WhichUtil splits the custom shell string on whitespace before invoking it
        # (confirmed in Worker_*.log: "Which2: 'C:/Program'", truncated at the space in "Program
        # Files"), then feeds that truncated fragment to Directory.EnumeratePaths, which throws
        # "Second path fragment must not be a drive or UNC name" — this breaks regardless of
        # quoting, so the path itself must not contain a space. -e/-o pipefail live in each
        # script instead of this shell line.
        shell: 'C:/PROGRA~1/Git/bin/bash.exe {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/AppData/Roaming/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_win64.exe.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          rm -rf godot
          mkdir -p godot
          unzip -q godot.zip -d godot
          mkdir -p ~/AppData/Roaming/Godot/export_templates
          rm -rf ~/AppData/Roaming/Godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/AppData/Roaming/Godot/export_templates/${GODOT_TEMPLATE_DIR}

      - name: Set exe name
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "EXE_NAME=OCGP-TPS-${GITHUB_REF_NAME}.exe" >> "$GITHUB_ENV"
          else
            echo "EXE_NAME=OCGP-TPS.exe" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: GODOT="$PWD/godot/Godot_v${GODOT_VERSION}_win64_console.exe" VERSION="${GITHUB_REF_NAME}" scripts/build.sh
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build (unversioned)
        run: GODOT="$PWD/godot/Godot_v${GODOT_VERSION}_win64_console.exe" scripts/build.sh
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Stamp manifest with the exe hash
        run: python scripts/stamp_manifest.py "build/$EXE_NAME" "OCGP-TPS ${GITHUB_REF_NAME}" build/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: OCGP-TPS
          path: |
            build/${{ env.EXE_NAME }}
            build/${{ env.EXE_NAME }}.sha256
            build/manifest.json
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # gh shells out to git to infer repo context; on this runner the checkout is owned by
          # a different account (SkatterBencher) than the one this step runs as (NETWORK
          # SERVICE), which git refuses by default ("detected dubious ownership").
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" "build/$EXE_NAME" "build/$EXE_NAME.sha256" build/manifest.json NOTICE.md --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

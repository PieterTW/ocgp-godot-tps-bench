name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_DIR: 4.7.2.stable

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/AppData/Roaming/Godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_win64.exe.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          rm -rf godot
          mkdir -p godot
          unzip -q godot.zip -d godot
          mkdir -p ~/AppData/Roaming/Godot/export_templates
          rm -rf ~/AppData/Roaming/Godot/export_templates/${GODOT_TEMPLATE_DIR}
          unzip -q templates.tpz -d tpl
          mv tpl/templates ~/AppData/Roaming/Godot/export_templates/${GODOT_TEMPLATE_DIR}

      - name: Build
        run: GODOT="$PWD/godot/Godot_v${GODOT_VERSION}_win64_console.exe" scripts/build.sh

      - name: Stamp manifest with the exe hash
        run: python scripts/stamp_manifest.py build/OCGP-TPS.exe "OCGP-TPS ${GITHUB_REF_NAME}" build/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: OCGP-TPS
          path: |
            build/OCGP-TPS.exe
            build/OCGP-TPS.exe.sha256
            build/manifest.json
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" build/OCGP-TPS.exe build/OCGP-TPS.exe.sha256 build/manifest.json NOTICE.md --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
